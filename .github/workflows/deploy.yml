name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # ou master, dependendo da sua branch principal

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configura explicitamente o Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 2. Instala as dependências do projeto
      - name: Install dependencies
        run: npm ci

      # 3. Executa o build de produção do Astro (gera a pasta dist)
      - name: Build site
        run: npm run build

      # 4. Prepara a pasta dist para o upload do GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4